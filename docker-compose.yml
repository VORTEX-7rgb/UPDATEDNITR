version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: collegeclaw_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: collegeclaw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collegeclaw"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: collegeclaw_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/collegeclaw

volumes:
  pgdata:
